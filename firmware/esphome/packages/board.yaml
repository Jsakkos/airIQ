# Platform, connectivity and offline-safety base shared by both models.
substitutions:
  name: airq
  friendly_name: airQ
  sen6x_model: SEN66
  led_count: "4"
  light_cap: "0.5"
  epd_model: waveshare-2.9in-v2
  # CO2 automatic self-calibration (ASC) default. The "CO2 auto-calibration"
  # Home Assistant switch (sensors.yaml) restores its last state at boot and then
  # overrides this; "false" here only changes that switch's first-boot default.
  # Rooms that rarely get fresh air should set "false" and use forced
  # recalibration outdoors (hold the button 5-15 s).
  co2_asc: "true"
  # Set to "false" for SEN62 / SEN65 / SEN68 (no CO2): the airQ light then
  # follows PM2.5 alone. (On the mini the CO2 half simply stays dark.)
  sen6x_has_co2: "true"
  # Colour bands (spec 6.5). CO2 in ppm: green below co2_yellow, yellow below
  # co2_orange, orange below co2_red, red from there. PM2.5 in ug/m3: each
  # *_max is the inclusive upper edge of its band; above pm25_purple_max is maroon.
  co2_yellow: "800"
  co2_orange: "1000"
  co2_red: "1500"
  pm25_green_max: "9.0"
  pm25_yellow_max: "35.4"
  pm25_orange_max: "55.4"
  pm25_red_max: "125.4"
  pm25_purple_max: "225.4"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Path is relative to the top-level device YAML in firmware/esphome/.
  includes:
    - include/airq_logic.h

esp32:
  board: esp32-c6-devkitm-1
  variant: esp32c6
  cpu_frequency: 80MHz
  framework:
    type: esp-idf

logger:
  # GPIO16/17 (UART0) are the aux UART header, so log over USB serial/JTAG.
  hardware_uart: USB_SERIAL_JTAG

# Offline safety: never reboot just because Home Assistant or Wi-Fi is gone.
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  reboot_timeout: 0s
  ap:
    ssid: ${name}-setup
    # Fallback AP (and the captive portal's /update upload) must not be open.
    password: !secret ap_password

captive_portal:

safe_mode:

button:
  - platform: safe_mode
    id: safe_mode_btn
    name: Safe mode

i2c:
  id: i2c_bus
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  frequency: 100kHz
