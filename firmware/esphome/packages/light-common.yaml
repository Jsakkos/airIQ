# Status-light plumbing shared by both models: the addressable strip, the two
# Home Assistant switches (the only way HA controls the light) and bookkeeping
# globals. light-worst.yaml / light-split.yaml add the logic.
# R16: every light entity is internal; HA only sees Status light / Night mode.
light:
  - platform: esp32_rmt_led_strip
    id: led_strip
    internal: true
    pin: ${pin_led_data}
    num_leds: ${led_count}
    chipset: SK6812  # SK6812SIDE-A side-view LEDs (WS2812 protocol, GRB)
    channel_colors: GRB

switch:
  - platform: template
    id: status_light
    name: Status light
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: night_mode
    name: Night mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

globals:
  # airq::Band stored as int, fed back into the *_band_hyst functions.
  - id: co2_band_g
    type: int
    initial_value: "0"
  - id: pm_band_g
    type: int
    initial_value: "0"
  # R17: last values passed to each light so the 2 s interval only issues a
  # call on a real change. Per light slot i: [i*5+0]=on (-1 forces a re-apply),
  # +1..+3 = r,g,b, +4 = brightness. Slot 0: worst/CO2 light, slot 1: PM light.
  - id: light_last
    type: float[10]
  # millis() deadline until which the interval must not touch the lights
  # (confirmation blink). 0 = no override.
  - id: light_override_until_ms
    type: uint32_t
    initial_value: "0"
