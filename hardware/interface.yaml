# airQ v3 interface contract: single source of truth for GPIOs, I2C addresses
# and connector pinouts. Consumed by the firmware and the PCB checkers.
# GPIOs verified against ESP32-C6-MINI-1 datasheet v1.5, Table 3-1.

signals:
  I2C_SDA: GPIO6
  I2C_SCL: GPIO7
  EPD_CLK: GPIO19
  EPD_MOSI: GPIO18
  EPD_CS: GPIO20
  EPD_DC: GPIO21
  EPD_RST: GPIO22
  EPD_BUSY: GPIO23
  LED_DATA: GPIO2
  BUTTON: GPIO9        # BOOT strapping pin; doubles as the download button
  AUX_UART_TX: GPIO16  # module TXD0 (U0TXD); note this is also the default UART0 console
  AUX_UART_RX: GPIO17  # module RXD0 (U0RXD)

i2c_addresses:
  sen6x: 0x6B
  sht45: 0x44
  bmp585: 0x46
  veml7700: 0x10
  sfa40: 0x5D  # verified: ESPHome sfa40 component default (i2c_device_schema(0x5D)), esphome 2026.11.1

# Net name on each pin, in pin order. NC = not connected.
connectors:
  # Sensirion SEN6x, JST GH 6-pin. Supply is 3.3 V (SEN66 runs on 3.15-3.45 V, spec section 3).
  # Pin order: Sensirion "SEN6x Datasheet" Version 0.5 (October 2024), section 4 Hardware
  # Interface Description, Table 16 "SEN6x pin assignment": 1 VDD, 2 GND, 3 SDA, 4 SCL,
  # 5 "GND or NC", 6 "VDD or NC" (5 is internally tied to 2, 6 to 1). Pins 5 and 6 are left NC.
  J_SEN66: [+3V3, GND, I2C_SDA, I2C_SCL, NC, NC]
  J_QWIIC_TONGUE: [GND, +3V3, I2C_SDA, I2C_SCL]
  J_QWIIC_AUX: [GND, +3V3, I2C_SDA, I2C_SCL]
  J_LED_EXT: [+5V, LED_DOUT_5V, GND]
  # EN = ESP32-C6 chip-enable net, BUTTON = GPIO9/BOOT: with pins 1-4 they give ROM-UART
  # recovery (hold BUTTON low, pulse EN) and take a future mmWave sensor.
  J_AUX_UART: [GND, +3V3, AUX_UART_TX, AUX_UART_RX, EN, BUTTON]
  # GoodDisplay GDEY029T94, 24-pin 0.5 mm FPC. Pin order: GoodDisplay "GDEY029T94 Product
  # Specifications" Rev 1.0 (2021/03/15; download "GDEY029T94_Specification(24.10.22)"), section 5
  # "Input/Output Pin Assignment" and the section 4 drawing's pin strip; identical to the
  # Waveshare "2.9inch e-Paper V2" Specification Rev 2.1 (2020/02/10), section 1.5. Pins 1 and 4
  # are NC, 5 = VSH2, 6/7 = TSCL/TSDA (unused, NC), 8 = BS1 (low = 4-wire SPI, hence GND),
  # 15 VDDIO and 16 VCI both +3V3, 17 VSS. NOT compatible with the older Waveshare 2.9" V1
  # (2017, IL3820-class) panel, whose pins 4/5 are VGL/VGH.
  # FPC contacts: on the front (viewing) face, stiffener on the back, per the GoodDisplay side
  # view "CONTACT SIDE"/"STIFFENER" labels (Waveshare V2 drawing: "CONNECT SIDE" on FRONT).
  # The datasheets have no assembly drawing, so the board connector contact type is chosen in
  # Task 3 (dual-contact recommended).
  J_EPD: [NC, EPD_GDR, EPD_RESE, NC, EPD_VSH2, NC, NC, GND, EPD_BUSY, EPD_RST, EPD_DC, EPD_CS, EPD_CLK, EPD_MOSI, +3V3, +3V3, GND, EPD_VDD, EPD_VPP, EPD_VSH1, EPD_VGH, EPD_VSL, EPD_VGL, EPD_VCOM]

# Board mechanics for the enclosure (PCB plan). Lengths in mm.
mechanical:
  # Sense tongue (hardware/src/tongue/layout.yaml, hardware/kicad/tongue/). Frame: origin at the
  # board's top-left corner (KiCad grid origin, as in layout.yaml), +X right, +Y down (toward the
  # Qwiic edge), +Z up from the top (component) surface. All parts are on top; the bottom is flat
  # (ground pour under the body only, no parts).
  tongue:
    front_edge: -Y                 # the long top edge faces the device front, behind the intake lip
    outline: [22.0, 13.0]          # W x H rectangle, square corners
    thickness: 1.6
    max_part_height: 3.0           # VEML7700 (J1 is 2.95); bottom side 0
    mounting_hole:
      center: [4.5, 10.4]          # below the SHT45 island
      diameter: 2.2                # non-plated, M2
      clear_diameter: 5.0          # flat, copper- and part-free circle round it (screw head, boss)
    sht45:                         # reference T/RH sensor, keep it in the intake air
      center: [4.5, 4.5]           # left end, 4.5 mm behind the front edge
      body: [1.5, 1.5, 0.55]       # L x W x H, sensing opening on top (+Z)
      island: [[2.5, 2.5], [7.5, 6.5]]   # board island it sits on; joins the board only via the neck
      neck: [[7.5, 3.3], [8.5, 5.7]]
      slot_width: 1.0              # milled slot round the island on 3 sides (top, left, bottom)
      slot: [[1.5, 1.5], [8.5, 1.5], [8.5, 3.3], [7.5, 3.3], [7.5, 2.5], [2.5, 2.5], [2.5, 6.5],
             [7.5, 6.5], [7.5, 5.7], [8.5, 5.7], [8.5, 7.5], [1.5, 7.5]]   # cutout polygon
    veml7700:                      # ambient light, side-view package, at the end opposite the SHT45
      faces: -Y                    # its window looks out of the front edge
      window_center: [18.35, 0.25, 1.95]  # sensitive-area centre on the window face (Z above board)
      body: [[14.95, 0.25], [21.75, 2.6]]  # 6.8 x 2.35 footprint, 3.0 high; window face 0.25 inside the edge
      half_sensitivity_angle: 55   # degrees (Vishay app note 84323): size the front window from this
    qwiic:                         # J1, JST SH 4-pin side entry (SM04B-SRSS-TB), J_QWIIC_TONGUE
      cable_entry: +Y              # back long edge (opposite the front); the cable leaves toward the main board
      mating_face_y: 12.36         # 0.64 inside the bottom edge
      center_x: 15.0               # pin 1 (GND) at x 13.5, pin 4 (SCL) at x 16.5
      body: [[12.0, 8.1], [18.0, 12.36]]  # 2.95 high

# GPIOs the design must not use.
# GPIO12/13 are USB D-/D+. GPIO10/11 are not exposed by the ESP32-C6-MINI-1 module,
# so they cannot appear in `signals` anyway.
reserved: [GPIO12, GPIO13]
