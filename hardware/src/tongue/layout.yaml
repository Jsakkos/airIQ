# airQ v3 sense tongue layout source: outline, milled slot, design rules, footprint placement.
# Coordinates are mm from the board's top-left corner, X right, Y down (KiCad's own axes);
# KiCad's grid origin is set to that corner. Rotations are degrees counter-clockwise.
#
# Arrangement (22 x 13 mm, global limit 22 x 14). The FRONT edge is the long top edge (-Y): it
# faces the device front, behind the intake lip (ruling R34). The cable leaves the opposite long
# edge (+Y), back toward the main board.
# - left end, near the front edge: the SHT45 (U1, centre 4.5, 4.5) on an island cut free by a
#   1.0 mm milled slot on three sides (top, left, bottom); the island joins the board only through a 2.4 mm neck on its
#   right, which carries the sensor's four 0.2 mm traces. No other copper within 1.5 mm of the
#   sensor: the rule area SHT45_ISOLATION (in the board file) bans vias and pours over the island,
#   the slot and the neck, and the custom rule below bans other parts' pads there.
# - right end, on the front edge: the VEML7700 (U2, side-view package), its window facing out of
#   the front edge (-Y), the same way as the SHT45 side. Its window face is 0.25 mm inside the edge.
# - back (bottom) edge: the Qwiic socket J1 (JST SH side entry), cable entering from +Y.
# - below the island: the M2 mounting hole H1, away from the copper.
# Routing, the B.Cu ground pour and the rule area live in the board file (hardware/README.md,
# regeneration contract) and survive rebuilds.

board:
  width: 22.0
  height: 13.0
  origin: [100.0, 100.0]     # page position of the top-left corner
  thickness: 1.6
  cutouts:
    # Milled slot around the SHT45, 1.0 mm wide: JLCPCB's minimum non-plated slot ("Min. Non-Plated
    # Slots: 1.0mm", drawn on the outline layer; jlcpcb.com/capabilities/pcb-capabilities, read
    # 2026-11-25), so there is no margin: do not narrow it. The bit rounds the slot's ends. One
    # polygon: top arm, left arm, bottom arm, and a 1.0 mm hook at each arm's right end that
    # narrows the island's neck to 2.4 mm (y 3.3..5.7).
    - [[1.5, 1.5], [8.5, 1.5], [8.5, 3.3], [7.5, 3.3], [7.5, 2.5], [2.5, 2.5], [2.5, 6.5],
       [7.5, 6.5], [7.5, 5.7], [8.5, 5.7], [8.5, 7.5], [1.5, 7.5]]

# Board design rules (KiCad "Constraints"): JLCPCB 2-layer, the main board's values.
rules:
  min_clearance: 0.15
  min_track_width: 0.15
  min_via_diameter: 0.6
  min_through_hole_diameter: 0.3
  min_via_annular_width: 0.15
  min_copper_edge_clearance: 0.3
  min_hole_to_hole: 0.25

netclasses:
  Default: {clearance: 0.15, track_width: 0.2, via_diameter: 0.6, via_drill: 0.3}

# DRC rule severities that differ from KiCad's defaults. Each needs a reason.
drc_severities: {}

# KiCad custom DRC rules, written to airq-tongue.kicad_dru. Each needs a reason.
custom_rules: |
  # Spec 6.2 / global constraint "Sense tongue": no copper within 1.5 mm of the SHT45 except its
  # own pads and traces. The rule area SHT45_ISOLATION (board file) covers the island, the slot
  # and the neck; it bans vias and pours there. This rule bans every other part's pads there.
  (rule "SHT45 isolation: only the SHT45's own pads"
    (constraint disallow pad)
    (condition "A.intersectsArea('SHT45_ISOLATION') && !A.memberOfFootprint('U1')"))

# REF: [x, y, rotation], or {at: [x, y, rotation], ref: [dx, dy] | [dx, dy, angle] | hide}
placement:
  # SHT45: pads 3/4 (VDD/VSS) face the neck, 1/2 (SDA/SCL) loop round; its reference text sits on
  # the frame below the slot
  U1: {at: [4.5, 4.5, 0], ref: [0, 3.9]}
  C1: [10.0, 4.5, 90]        # SHT45 100 nF, just past the neck (5.5 mm from the sensor)
  # VEML7700: footprint -Y (window) = front edge, face at y = 0.25; reference text left of C2
  U2: {at: [18.35, 2.1, 0], ref: [-2.85, 3.9]}
  C2: [18.35, 4.0, 180]      # VEML7700 100 nF, under its VDD (right) and GND (left) pads
  J1: [15.0, 9.85, 0]        # Qwiic socket: mating face toward +Y, fitting nails 0.31 mm in
  H1: [4.5, 10.4, 270]       # M2 hole, 2.2 mm (turned so its reference text clears the slot)
