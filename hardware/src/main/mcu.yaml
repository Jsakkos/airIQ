# MCU sheet: ESP32-C6 module with its supply, reset and strap parts; the I2C bus pull-ups and the
# on-board pressure sensor.
# Each part: `at` is the symbol anchor on the A4 page in mm (Y down, on the 1.27 mm grid);
# `pins` maps symbol pins (by number or by pin name) to net names (NC = no connection), see
# hardware/README.md. Net names are global across the board: one name, one net.
#
# The module's GPIO signals (I2C, e-ink SPI, LED data, button, aux UART) are NOT listed here: the
# module carries `Role: MCU`, so the generator wires each `signals` entry of hardware/interface.yaml
# to the module pin named IO<n>. The pins below are the module's supply, EN, straps, USB and NC.
#
# MCU and pressure sensor are PROVISIONAL (rulings R22, R35: option A, Economic tier). To swap to
# option B (ESP32-C6-MINI-1-N4 + BMP585), replace the U3 and U4 entries only; see
# hardware/kicad/lib/README.md "Provisional MCU and pressure sensor".

title: "MCU, I2C bus, pressure sensor"
paper: A4

notes:
  - {text: "ESP32-C6 module (Role MCU)\nPROVISIONAL (ruling R22): ESP32-C6-WROOM-1-N8; option B = ESP32-C6-MINI-1-N4\nGPIO signals: hardware/interface.yaml `signals`\nIO12 / IO13 = USB D- / D+ (native USB flashing)\nGPIO4, GPIO5, GPIO15 (straps) and IO0, IO1, IO3, IO10, IO11: not connected", at: [73.66, 50.8], size: 1.8}
  - {text: "Module 3V3: 10 uF (R15) + 100 nF", at: [17.78, 63.5], size: 1.8}
  - {text: "EN: 10 k / 1 uF reset RC", at: [17.78, 99.06], size: 1.8}
  - {text: "GPIO8 strap: 10 k pull-up\n(ROM download needs it high)\nGPIO9 = BUTTON: pull-up on\nthe leds_button sheet", at: [17.78, 142.24], size: 1.8}
  - {text: "I2C bus: 4.7 k pull-ups to +3V3 (main board only)\nShared by SEN66, sense tongue, Qwiic aux, pressure sensor", at: [154.94, 63.5], size: 1.8}
  - {text: "Pressure sensor, I2C address 0x77\nPROVISIONAL (ruling R22): MS5611-01BA03; option B = BMP585\nPS = VDD: I2C mode. CSB (pins 4, 5) = GND: address 0x77\nSDO is not used in I2C mode", at: [154.94, 124.46], size: 1.8}

parts:
  # -- MCU module (PROVISIONAL option A). Signals come from interface.yaml through `Role: MCU`.
  U3:
    symbol: airq:ESP32-C6-WROOM-1-N8
    at: [101.6, 104.14]
    fields: {Role: MCU}
    fields_at: {Reference: [-12.7, -20.32]}   # above the body's left half, clear of pin 29's GND
    pins:
      GND: GND          # pins 1, 28 and the EPAD (29-37, stacked in the symbol)
      3V3: +3V3
      EN: EN
      IO8: MCU_IO8      # strap: pull-up only (R7)
      IO12: USB_DN      # native USB D-
      IO13: USB_DP      # native USB D+
      IO0: NC           # XTAL_32K_P, unused
      IO1: NC           # XTAL_32K_N, unused
      IO3: NC
      IO4: NC           # MTMS strap
      IO5: NC           # MTDI strap
      IO10: NC          # WROOM-1 only (not on the MINI-1)
      IO11: NC          # WROOM-1 only (not on the MINI-1)
      IO15: NC          # strap: must not be driven
      NC: NC            # module pin 22
  C8:                   # module 3V3 bulk, >= 10 uF (ruling R15)
    symbol: Device:C
    at: [25.4, 76.2]
    value: 10uF
    footprint: Capacitor_SMD:C_0805_2012Metric
    lcsc: C15850
    pins: [+3V3, GND]
  C9:                   # module 3V3 decoupling
    symbol: Device:C
    at: [38.1, 76.2]
    value: 100nF
    footprint: Capacitor_SMD:C_0402_1005Metric
    lcsc: C1525
    pins: [+3V3, GND]
  R6:                   # EN pull-up (Espressif RC: 10 k / 1 uF)
    symbol: Device:R
    at: [25.4, 111.76]
    value: 10k
    footprint: Resistor_SMD:R_0402_1005Metric
    lcsc: C25744
    pins: [+3V3, EN]
  C10:                  # EN delay
    symbol: Device:C
    at: [38.1, 111.76]
    value: 1uF
    footprint: Capacitor_SMD:C_0603_1608Metric
    lcsc: C15849
    pins: [EN, GND]
  R7:                   # GPIO8 strap pull-up (ruling R17)
    symbol: Device:R
    at: [25.4, 157.48]
    value: 10k
    footprint: Resistor_SMD:R_0402_1005Metric
    lcsc: C25744
    pins: [+3V3, MCU_IO8]

  # -- I2C bus pull-ups (main board only)
  R8:
    symbol: Device:R
    at: [160.02, 85.09]
    value: 4.7k
    footprint: Resistor_SMD:R_0402_1005Metric
    lcsc: C25900
    pins: [+3V3, I2C_SDA]
  R9:
    symbol: Device:R
    at: [175.26, 85.09]
    value: 4.7k
    footprint: Resistor_SMD:R_0402_1005Metric
    lcsc: C25900
    pins: [+3V3, I2C_SCL]

  # -- Pressure sensor (PROVISIONAL option A): TE MS5611-01BA03 in I2C mode
  U4:
    symbol: airq:MS561101BA03-50
    at: [190.5, 143.51]
    stub: 2.54
    pins:
      VDD: +3V3
      PS: +3V3          # protocol select high: I2C
      GND: GND
      CSB: GND          # pins 4 and 5: CSB low -> I2C address 0x77
      SDO: NC           # SPI only
      SDI/SDA: I2C_SDA
      SCLK: I2C_SCL
  C11:                  # MS5611 VDD decoupling
    symbol: Device:C
    at: [236.22, 143.51]
    value: 100nF
    footprint: Capacitor_SMD:C_0402_1005Metric
    lcsc: C1525
    pins: [+3V3, GND]
