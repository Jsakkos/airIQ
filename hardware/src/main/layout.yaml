# airQ v3 main board layout source: outline, design rules, net classes, footprint placement.
# Coordinates are mm from the board's top-left corner, X right, Y down (KiCad's own axes);
# KiCad's grid origin is set to that corner. Rotations are degrees counter-clockwise.
#
# Arrangement (60 x 30 mm). The FRONT edge is the bottom edge (+Y, y = 30), so left/right here are
# left/right for someone in front of the device (hardware/README.md "Main board layout";
# hardware/interface.yaml mechanical.main, checked by tests/hardware/test_main_board.py).
# - rear edge: M2 hole, USB-C (mouth on the edge), ESD, then the buck in a row; the ESP32-C6-WROOM-1
#   at the rear-right corner, its antenna strip over the rear edge (rule area ANTENNA_KEEPOUT).
# - front edge: LEDs D1, D2 (mini CO2 half) | FPC J7 (in the divider gap) | D3, D4 (PM2.5 half),
#   J_LED_EXT, and the side-push button at the front-right.
# - left edge: J_SEN66, J_QWIIC_AUX, J_QWIIC_TONGUE (front-left corner), mouths out of the edge.
# Routing, pours and rule areas live in the board file (README, regeneration contract).

board:
  width: 60.0
  height: 30.0
  origin: [100.0, 100.0]     # page position of the top-left corner
  thickness: 1.6

# Board design rules (KiCad "Constraints"): JLCPCB 2-layer, conservative values.
rules:
  min_clearance: 0.15
  min_track_width: 0.15
  min_via_diameter: 0.6
  min_through_hole_diameter: 0.3
  min_via_annular_width: 0.15
  min_copper_edge_clearance: 0.3
  min_hole_to_hole: 0.25

netclasses:
  Default: {clearance: 0.15, track_width: 0.2, via_diameter: 0.6, via_drill: 0.3}
  Power:
    clearance: 0.15
    track_width: 0.4
    via_diameter: 0.6
    via_drill: 0.3
    nets: ["+5V", "+3V3", "GND", "*BUCK_SW"]   # 0.4 mm is the drawing default; routed at >= 0.3 mm

# DRC rule severities that differ from KiCad's defaults (the generator also makes the schematic
# parity checks errors). Each needs a reason.
drc_severities: {}

# KiCad custom DRC rules, written to airq-main.kicad_dru. Each needs a reason.
custom_rules: |
  # USB-C J1: its ground pins and shell legs carry the USB return and ESD current; connect them to
  # both pours solid (no thermal relief) so the pour around the connector's crowded pin row cannot
  # leave them starved.
  (rule "J1 ground: solid to the pours"
    (constraint zone_connection solid)
    (condition "A.Type == 'Pad' && A.memberOfFootprint('J1') && A.NetName == 'GND'"))

# REF: [x, y, rotation], or {at: [x, y, rotation], ref: [dx, dy] | [dx, dy, angle] | hide}
placement:
  # -- rear edge, left to right: mounting hole, USB-C, buck
  H1: {at: [8.55, 2.6, 0], ref: hide}
  J1: {at: [16.2, 5.0, 180], ref: [0, -1.5]}
  R2: {at: [14.45, 9.6, 270], ref: hide}
  R1: {at: [18.8, 9.5, 0], ref: hide}
  U1: {at: [16.2, 13.0, 0], ref: [2.7, 0, 90]}
  C7: {at: [13.0, 10.9, 180], ref: hide}
  R4: {at: [22.35, 0.95, 180], ref: hide}
  R3: {at: [24.25, 0.95, 180], ref: hide}
  R5: {at: [21.9, 3.4, 90], ref: hide}
  U2: {at: [24.6, 3.4, 0], ref: [0, 0, 90]}
  C4: {at: [24.6, 6.0, 0], ref: hide}
  C3: {at: [25.4, 7.6, 90], ref: hide}
  C1: {at: [27.75, 3.4, 270], ref: hide}
