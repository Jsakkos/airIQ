# Power sheet: USB-C 5 V sink, USB ESD, 5 V -> 3.3 V synchronous buck.
# Parts and values: .superpowers/sdd/2026-11-25-airq-v3-2-pcb/task-3-research.md section 4 (TI SLVSD91D).
# Each part: `at` is the symbol anchor on the A4 page in mm (Y down, on the 1.27 mm grid);
# `pins` maps every symbol pin number to a net name (NC = no connection), see hardware/README.md.
# Net names are global across the board: one name, one net.

title: "Power: USB-C input, ESD, 3.3 V buck"
paper: A4

notes:
  - {text: "USB-C input, 5 V sink\nCC1, CC2: own 5.1 k to GND each", at: [17.78, 45.72], size: 1.8}
  - {text: "USB ESD\nD+, D-, VBUS", at: [88.9, 45.72], size: 1.8}
  - {text: "Buck 5 V -> 3.3 V, 2 A (TPS562201)\nVOUT = 0.768 V x (1 + 33k / 10k) = 3.30 V", at: [160.02, 45.72], size: 1.8}
  - {text: "ERC power flags", at: [83.82, 137.16], size: 1.8}

parts:
  # -- USB-C receptacle (SHOU HAN TYPE-C 16PIN 2MD(073)), drawn mirrored so its pins face right
  J1:
    symbol: airq:TYPE-C16PIN2MD
    at: [45.72, 76.2]
    mirror: y
    stub: 5.08          # room for the long pin numbers (A1B12 ...) of this symbol's short pins
    pins:
      A1B12: GND
      A4B9: +5V
      B8: NC            # SBU2
      A5: USB_CC1
      B7: USB_DN        # D- (B side)
      A6: USB_DP        # D+ (A side)
      A7: USB_DN        # D- (A side)
      B6: USB_DP        # D+ (B side)
      A8: NC            # SBU1
      B5: USB_CC2
      B4A9: +5V
      B1A12: GND
      "13": GND         # shell
      "14": GND         # shell
  R1:                   # CC1 sink pull-down
    symbol: Device:R
    at: [38.1, 119.38]
    value: 5.1k
    footprint: Resistor_SMD:R_0402_1005Metric
    lcsc: C25905
    pins: [USB_CC1, GND]
  R2:                   # CC2 sink pull-down (its own resistor: USB-C to C cables need both)
    symbol: Device:R
    at: [50.8, 119.38]
    value: 5.1k
    footprint: Resistor_SMD:R_0402_1005Metric
    lcsc: C25905
    pins: [USB_CC2, GND]

  # -- ESD: ST USBLC6-2SC6. I/O1 (pins 1, 6) carries D+, I/O2 (pins 3, 4) carries D-
  U1:
    symbol: airq:USBLC6-2SC6
    at: [101.6, 76.2]
    pins: {"1": USB_DP, "2": GND, "3": USB_DN, "4": USB_DN, "5": +5V, "6": USB_DP}
  C7:                   # 100 nF at the USBLC6 VBUS pin
    symbol: Device:C
    at: [137.16, 76.2]
    value: 100nF
    footprint: Capacitor_SMD:C_0402_1005Metric
    lcsc: C1525
    pins: [+5V, GND]

  # -- Buck: TI TPS562201DDCR
  U2:
    symbol: airq:TPS562201DDCR
    at: [190.5, 76.2]
    stub: 2.54
    pins: {"1": GND, "2": BUCK_SW, "3": +5V, "4": BUCK_FB, "5": BUCK_EN, "6": BUCK_BST}
  C1:                   # input bulk
    symbol: Device:C
    at: [165.1, 101.6]
    value: 10uF
    footprint: Capacitor_SMD:C_0805_2012Metric
    lcsc: C15850
    pins: [+5V, GND]
  C2:                   # input bulk
    symbol: Device:C
    at: [175.26, 101.6]
    value: 10uF
    footprint: Capacitor_SMD:C_0805_2012Metric
    lcsc: C15850
    pins: [+5V, GND]
  C3:                   # input high-frequency decoupling, closest to VIN
    symbol: Device:C
    at: [185.42, 101.6]
    value: 100nF
    footprint: Capacitor_SMD:C_0402_1005Metric
    lcsc: C1525
    pins: [+5V, GND]
  C4:                   # bootstrap VBST - SW
    symbol: Device:C
    at: [213.36, 101.6]
    rot: 90
    value: 100nF
    footprint: Capacitor_SMD:C_0402_1005Metric
    lcsc: C1525
    pins: [BUCK_BST, BUCK_SW]
  R5:                   # EN pull-up to VIN (TI EVM R3)
    symbol: Device:R
    at: [213.36, 124.46]
    value: 10k
    footprint: Resistor_SMD:R_0402_1005Metric
    lcsc: C25744
    pins: [+5V, BUCK_EN]
  L1:                   # Sunlord WPN4020H3R3MT, Isat 5.9 A
    symbol: airq:WPN4020H3R3MT
    at: [231.14, 76.2]
    value: 3.3uH
    pins: [BUCK_SW, +3V3]
  C5:                   # output
    symbol: Device:C
    at: [231.14, 101.6]
    value: 22uF
    footprint: Capacitor_SMD:C_0805_2012Metric
    lcsc: C45783
    pins: [+3V3, GND]
  C6:                   # output
    symbol: Device:C
    at: [241.3, 101.6]
    value: 22uF
    footprint: Capacitor_SMD:C_0805_2012Metric
    lcsc: C45783
    pins: [+3V3, GND]
  R3:                   # feedback, top
    symbol: Device:R
    at: [254.0, 101.6]
    value: 33k
    footprint: Resistor_SMD:R_0402_1005Metric
    lcsc: C25779
    pins: [+3V3, BUCK_FB]
  R4:                   # feedback, bottom
    symbol: Device:R
    at: [266.7, 101.6]
    value: 10k
    footprint: Resistor_SMD:R_0402_1005Metric
    lcsc: C25744
    pins: [BUCK_FB, GND]

  # -- ERC: these nets are driven only through connector and passive pins
  "#FLG01":
    symbol: power:PWR_FLAG
    at: [91.44, 152.4]
    rot: 180
    pins: [+5V]
  "#FLG02":
    symbol: power:PWR_FLAG
    at: [104.14, 147.32]
    pins: [GND]
  "#FLG03":
    symbol: power:PWR_FLAG
    at: [116.84, 152.4]
    rot: 180
    pins: [+3V3]
